<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📦 晉昌鋼架柯打編輯器</title>
    <style>
        :root {
            --primary: #25D366; 
            --primary-dark: #128C7E;
            --bg: #f4f6f8;
            --card-bg: #ffffff;
            --text: #1c1e21;
            --border: #d1d5db;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 15px;
        }
        .app-container {
            max-width: 500px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
            font-size: 20px;
            margin-top: 0;
            color: #333;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
        }
        .form-group { margin-bottom: 15px; width: 100%; }
        
        /* 針對手機並排顯示的修復 */
        .form-row { display: flex; gap: 10px; width: 100%; }
        .form-row .form-group { flex: 1 1 0; min-width: 0; margin-bottom: 0; }
        .flex-35 { flex: 3.5 1 0 !important; }
        .flex-65 { flex: 6.5 1 0 !important; }

        label {
            display: block; font-size: 14px; font-weight: 600;
            margin-bottom: 6px; color: #4b5563;
        }
        
        input[type="text"], input[type="number"], input[type="date"], select, textarea {
            width: 100%; min-height: 44px; padding: 8px 10px; 
            border: 1px solid var(--border); border-radius: 8px; 
            box-sizing: border-box; font-size: 16px; 
            background-color: #fafafa; transition: border-color 0.2s; margin: 0;
        }
        input:focus, select:focus, textarea:focus {
            outline: none; border-color: var(--primary); background-color: #fff;
        }
        
        textarea { resize: vertical; min-height: 140px; line-height: 1.5; }
        
        .btn {
            width: 100%; padding: 14px; background-color: var(--primary);
            color: white; border: none; border-radius: 8px; font-size: 16px;
            font-weight: bold; cursor: pointer; margin-top: 10px;
            box-shadow: 0 2px 4px rgba(37, 211, 102, 0.3);
        }
        .btn:active { background-color: var(--primary-dark); transform: scale(0.98); }
        .preview-section {
            margin-top: 20px; background: #e5ddd5; padding: 15px;
            border-radius: 8px; position: relative;
        }
        .preview-bubble {
            background: white; padding: 12px 16px; border-radius: 8px;
            border-top-left-radius: 0; box-shadow: 0 1px 1px rgba(0,0,0,0.1);
            white-space: pre-wrap; font-family: inherit; font-size: 15px;
            line-height: 1.5; color: #111b21; user-select: all;
        }
        .notice { font-size: 12px; color: #6b7280; text-align: center; margin-top: 10px; }
        .hint-text { font-size: 11px; color: #d97706; margin-top: 4px; display: block; }
    </style>
</head>
<body>
    <div class="app-container">
        <h2>📦 晉昌鋼架柯打編輯器</h2>

        <div class="form-row form-group">
            <div class="form-group">
                <label>日期</label>
                <input type="date" id="dateInput">
            </div>
            <div class="form-group">
                <label>時段/動作</label>
                <select id="timeSlot">
                    <option value="上午送貨">上午送貨</option>
                    <option value="下午送貨">下午送貨</option>
                    <option value="上午收貨">上午收貨</option>
                    <option value="下午收貨">下午收貨</option>
                    <option value="後加">後加</option>
                    <option value="購貨">購貨</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>地盤選擇 (自動綁定聯絡人與車次)</label>
            <select id="siteSelect">
                <option value="中鐵-清水灣(租賃)">中鐵-清水灣(租賃)</option>
                <option value="智發-東涌42區[4-5座] (租賃)">智發-東涌42區[4-5座] (租賃)</option>
                <option value="智發-東涌42[6座] (租賃)">智發-東涌42[6座] (租賃)</option>
                <option value="景澤-東涌(租賃)">景澤-東涌(租賃)</option>
                <option value="恆德-藍田(租賃)">恆德-藍田(租賃)</option>
                <option value="熙信 - 謝斐道(租賃)">熙信 - 謝斐道(租賃)</option>
                <option value="custom">-- 其他地盤 (手動輸入) --</option>
            </select>
            <input type="text" id="customSite" style="display:none; margin-top:8px;" placeholder="請輸入新地盤名稱">
        </div>

        <div class="form-group">
            <label>地盤聯絡人</label>
            <input type="text" id="contactInfo">
        </div>

        <div class="form-row form-group">
            <div class="form-group flex-35">
                <label>第幾車</label>
                <input type="number" id="carNum" value="1" min="1">
                <span class="hint-text" id="carNumHint">已自動+1</span>
            </div>
            <div class="form-group flex-65">
                <label>車牌 (自動綁定司機)</label>
                <select id="plateSelect">
                    <optgroup label="APS 車隊">
                        <option value="LV538">LV538 (斌哥)</option>
                    </optgroup>
                    <optgroup label="安記運輸">
                        <option value="UX3633">UX3633 (倫)</option>
                        <option value="街車 YM3989">街車 YM3989 (棟)</option>
                        <option value="街車 WL9721">街車 WL9721 (光)</option>
                        <option value="街車 TD1814">街車 TD1814 (志)</option>
                        <option value="XW142">XW142 (偉)</option>
                        <option value="ZX2448">ZX2448 (棟)</option>
                        <option value="TL142">TL142 (俊)</option>
                        <option value="VT6338">VT6338 (黎輝)</option>
                    </optgroup>
                    <option value="custom">-- 其他 (手動輸入) --</option>
                </select>
                <input type="text" id="customPlate" style="display:none; margin-top:8px;" placeholder="請輸入新車牌">
            </div>
        </div>

        <div class="form-group">
            <label>司機 (名字 & 電話)</label>
            <input type="text" id="driver" placeholder="例: *斌哥 5636 6199*">
        </div>

        <div class="form-group">
            <label>材料清單 (直接貼上 WhatsApp 明細)</label>
            <textarea id="materials" placeholder="在此直接貼上送貨明細...&#10;&#10;(橋B落料) 下路&#10;直杆2.0米 (有駁芯) =3碼&#10;..."></textarea>
        </div>

        <button class="btn" onclick="copyToWhatsApp()">一鍵複製內容 (並記憶車次)</button>
        <div class="notice">複製後即可直接貼上到群組，系統會自動記住當前車次。</div>

        <div class="preview-section">
            <label style="font-size: 13px; color: #555; margin-bottom: 8px; display: block;">實時預覽：</label>
            <div class="preview-bubble" id="previewBox"></div>
        </div>
    </div>

    <script>
        // 📋 地盤與聯絡人資料庫
        const siteDatabase = {
            "中鐵-清水灣(租賃)": "傑 9207 1404 / 陽 6354 6598",
            "智發-東涌42區[4-5座] (租賃)": "子建 5403 6365",
            "智發-東涌42[6座] (租賃)": "余建清 9792 7157",
            "景澤-東涌(租賃)": "景澤-阿進 9229 8114",
            "恆德-藍田(租賃)": "斌 5493 9627",
            "熙信 - 謝斐道(租賃)": "鄭生 6449 9116"
        };

        // 🚚 車牌與司機資料庫
        const driverDatabase = {
            "LV538": "*斌哥 5636 6199*",
            "UX3633": "*倫60996434*",
            "街車 YM3989": "*棟 9628 0816*",
            "街車 WL9721": "*光 94873324*",
            "街車 TD1814": "志 9860 5480",
            "XW142": "*偉 67977984*",
            "ZX2448": "*棟 9628 0816*",
            "TL142": "*俊 61210710*",
            "VT6338": "黎輝 9838 9093"
        };

        // DOM 元素綁定
        const els = {
            date: document.getElementById('dateInput'),
            time: document.getElementById('timeSlot'),
            site: document.getElementById('siteSelect'),
            customSite: document.getElementById('customSite'),
            contact: document.getElementById('contactInfo'),
            carNum: document.getElementById('carNum'),
            carNumHint: document.getElementById('carNumHint'),
            plate: document.getElementById('plateSelect'),
            customPlate: document.getElementById('customPlate'),
            driver: document.getElementById('driver'),
            materials: document.getElementById('materials'),
            preview: document.getElementById('previewBox')
        };

        // 初始化日期為今天
        els.date.valueAsDate = new Date();

        function formatDate(dateStr) {
            if (!dateStr) return "";
            const d = new Date(dateStr);
            const dd = String(d.getDate()).padStart(2, '0');
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const yyyy = d.getFullYear();
            const days = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            return `${dd}/${mm}/${yyyy}[${days[d.getDay()]}]`;
        }

        // 🔄 更新地盤：綁定聯絡人 + 自動讀取記憶的車次
        function handleSiteChange() {
            const selected = els.site.value;
            if (selected === 'custom') {
                els.customSite.style.display = 'block';
                els.contact.value = '';
                els.carNumHint.style.display = 'none';
            } else {
                els.customSite.style.display = 'none';
                els.contact.value = siteDatabase[selected] || '';
                
                // 讀取該地盤上一次的車次記憶
                const lastNum = localStorage.getItem('site_car_num_' + selected);
                if (lastNum) {
                    els.carNum.value = parseInt(lastNum, 10) + 1;
                    els.carNumHint.innerText = `上車為 ${lastNum}，已自動+1`;
                    els.carNumHint.style.display = 'block';
                } else {
                    // 如果沒有記憶，預設給 1
                    // els.carNum.value = 1; (保留你當前輸入框的值，不強制清零，比較彈性)
                    els.carNumHint.style.display = 'none';
                }
            }
            updatePreview();
        }

        // 🔄 更新車牌與司機
        function handlePlateChange() {
            const selected = els.plate.value;
            if (selected === 'custom') {
                els.customPlate.style.display = 'block';
                els.driver.value = '';
            } else {
                els.customPlate.style.display = 'none';
                els.driver.value = driverDatabase[selected] || '';
            }
            updatePreview();
        }

        function generateMessage() {
            const dateText = formatDate(els.date.value);
            const timeText = els.time.value;
            const siteText = els.site.value === 'custom' ? els.customSite.value : els.site.value;
            const plateText = els.plate.value === 'custom' ? els.customPlate.value : els.plate.value;
            
            let msg = `日期： ${dateText} ${timeText}\n`;
            msg += `地點： ${siteText} 第${els.carNum.value}車\n`;
            msg += `車牌： ${plateText}\n`;
            msg += `司機： ${els.driver.value}\n`;
            msg += `地盤聯絡人： ${els.contact.value}\n`;
            msg += `車型： 30噸吊雞車\n`;
            msg += `材料： 金屬鋼架\n\n\n`;
            
            const mats = els.materials.value.trim();
            if (mats) {
                msg += mats;
            }

            return msg;
        }

        function updatePreview() {
            els.preview.innerText = generateMessage();
        }

        Object.values(els).forEach(el => {
            if(el && el.tagName && el.id !== 'carNumHint') {
                el.addEventListener('input', updatePreview);
                el.addEventListener('change', updatePreview);
            }
        });

        els.site.addEventListener('change', handleSiteChange);
        els.plate.addEventListener('change', handlePlateChange);

        // 📋 一鍵複製功能 (並將當前車次寫入記憶)
        function copyToWhatsApp() {
            const text = generateMessage();
            
            // 儲存當前車次紀錄到本機瀏覽器
            const selectedSite = els.site.value;
            if (selectedSite !== 'custom') {
                localStorage.setItem('site_car_num_' + selectedSite, els.carNum.value);
            }

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    alert("✅ 已成功複製，並記住當前車次！");
                    // 複製完後稍微更新一下提示文字
                    els.carNumHint.innerText = `已儲存紀錄為第 ${els.carNum.value} 車`;
                    els.carNumHint.style.display = 'block';
                }).catch(() => fallbackCopy(text));
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = "fixed";
            ta.style.opacity = 0;
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                alert("✅ 已成功複製，並記住當前車次！");
            } catch (err) {
                alert("請長按下方預覽區手動複製");
            }
            document.body.removeChild(ta);
        }

        // 初始執行
        handleSiteChange();
        handlePlateChange();
    </script>
</body>
</html>
